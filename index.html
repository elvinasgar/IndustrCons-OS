<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IndustrCons OS — Construction Operating System</title>
<meta name="description" content="IndustrCons OS — tikinti şirkətləri üçün tam idarəetmə platforması">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ TOP LOADING / BLUEPRINT GRID BG ============ -->
<div class="blueprint-bg" aria-hidden="true"></div>

<!-- ============ MOBILE TOPBAR TOGGLE ============ -->
<button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Menyunu aç">
  <span></span><span></span><span></span>
</button>

<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">IC</div>
      <div class="brand-text">
        <strong>IndustrCons</strong>
        <span>OS · v1.0</span>
      </div>
    </div>

    <nav class="nav-groups" id="navGroups">
      <!-- injected by js/app.js -->
    </nav>

    <div class="sidebar-footer">
      <div class="corner-mark corner-tl"></div>
      <span id="buildTag">STATIC BUILD · LOCAL STORAGE</span>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- ============ MAIN ============ -->
  <div class="main-col">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Layihələrinizə ümumi baxış</p>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          <input type="text" placeholder="Axtar... (layihə, şirkət, sənəd)" id="globalSearch">
        </div>
        <button class="icon-btn" id="themeToggle" aria-label="Tema dəyiş" title="Dark/Light">
          <svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/></svg>
        </button>
        <button class="icon-btn" id="notifBtn" aria-label="Bildirişlər" title="Bildirişlər">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a6 6 0 0 0-6 6v3.09c0 .58-.2 1.14-.57 1.59L4 14.5V16h16v-1.5l-1.43-1.82a2.5 2.5 0 0 1-.57-1.59V8a6 6 0 0 0-6-6zm0 20a2.5 2.5 0 0 0 2.45-2H9.55A2.5 2.5 0 0 0 12 22z"/></svg>
          <span class="notif-dot"></span>
        </button>
        <div class="user-chip">
          <div class="avatar">EA</div>
        </div>
      </div>
    </header>

    <!-- TITLE BLOCK (engineering drawing style record strip) -->
    <div class="title-block">
      <div class="tb-field tb-project">
        <span class="tb-label">Layihə</span>
        <input type="text" id="tbProjectName" class="tb-input" value="Untitled Project" spellcheck="false">
      </div>
      <div class="tb-sep"></div>
      <div class="tb-field">
        <span class="tb-label">Vərəq</span>
        <span class="tb-value" id="tbSheet">01 — DASHBOARD</span>
      </div>
      <div class="tb-sep"></div>
      <div class="tb-field">
        <span class="tb-label">Tarix</span>
        <span class="tb-value" id="tbDate">—</span>
      </div>
      <div class="tb-saved" id="tbSaved">
        <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        <span>Saved</span>
      </div>
    </div>

    <!-- CONTENT ROUTER -->
    <main class="content" id="content">
      <!-- module views injected here by js/app.js -->
    </main>
  </div>
</div>

<!-- ============ MODAL ROOT ============ -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalRoot"></div>
</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast"></div>

<script src="js/db.js"></script>
<script src="js/calculators.js"></script>
<script src="js/modules.js"></script>
<script src="js/app.js"></script>
</body>
</html>
